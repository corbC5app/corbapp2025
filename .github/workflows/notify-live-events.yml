name: Notifica live eventi

on:
  schedule:
    - cron: '*/3 17-22 * * 2-5'   # ogni 3 minuti, mar-ven, 19-24 ora italiana (UTC+2)
  workflow_dispatch: {}            # lancio manuale da GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        working-directory: ./scripts
        run: npm install

      - name: Controlla dirette e invia notifiche (solo Corbiolo)
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify-live-events.js
