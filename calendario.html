<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <script>(function(){var a=localStorage.getItem("corb-theme-auto");if(a===null)a="on";var t;if(a==="on"){var h=new Date().getHours();t=(h>=19||h<7)?"dark":"light";}else{t=localStorage.getItem("corb-theme")||"light";}document.documentElement.dataset.theme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Calendario - CORBIOLOC5</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/logo_c5.png">
  <link rel="stylesheet" href="./style.css?v=35">
  <style>
    .container{gap:8px}
    .month-wrap{margin-bottom:10px;padding:12px}
    .month-head{display:flex;align-items:center;justify-content:space-between}
    .month-name{font-weight:900;line-height:1.05;font-size:clamp(15px,4.5vw,20px)}
    .head-right{display:flex;gap:6px}
    .arrowbtn{border-radius:9px;border:1px solid var(--ring);background:var(--card);padding:3px 8px;font-size:13px}
    .legend{display:flex;gap:16px;align-items:center;margin-top:4px}
    .dot{width:9px;height:9px;border-radius:999px}
    .dot-home{background:var(--home)} .dot-away{background:var(--away)}
    .cal-dow{margin:6px 0 4px;gap:4px;font-size:11px}
    .cal-grid{gap:4px}
    .cal-cell{border-radius:8px;font-size:clamp(10px,2.8vw,13px)}
    .month-block{margin-bottom:4px}
    #futureList .future-row{padding:6px 0}
    :root[data-theme="dark"] .arrowbtn{color:#fff}
    .day-overlay{
      position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .day-popup{
      background:var(--card);color:var(--text);border-radius:16px;padding:18px;
      max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);
      animation:day-pop .15s ease-out;
    }
    @keyframes day-pop{ from{ transform:scale(.92); opacity:0 } to{ transform:scale(1); opacity:1 } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a href="./index.html" class="brand" aria-label="Home">
        <img src="img/logo_c5.png" alt="Corbiolo" class="brand-logo">
        <span class="title">Calendario</span>
      </a>
    </div>
    <div class="right">
      <button type="button" id="menuBtn" class="iconbtn" aria-label="Apri menu" title="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="drawer" class="drawer" aria-label="Menu laterale">
    <button type="button" id="drawer-close" class="drawer-close" aria-label="Chiudi">✕</button>
    <h3>Menu</h3>
    <a href="./index.html">🏠 Home</a>
    <a href="./news.html">📰 News</a>
    <a href="./squadra.html">👥 Squadra</a>
    <a href="./video.html">🎥 Video</a>
    <a href="./prossima.html">📅 Prossima partita</a>
    <a href="./partite.html">🏆 Risultati</a>
    <a href="./calendario.html">📆 Calendario</a>
    <a href="./competizioni.html">📋 Competizioni</a>
    <a href="./classifica.html">🏅 Classifica</a>
    <a href="./dove.html">📍 Dove si gioca</a>
    <a href="./settings.html">🔔 Impostazioni</a>
    <a href="./admin.html">⚙️ Admin</a>
    <hr style="border:none;border-top:1px solid var(--ring);margin:10px 0">
    <a href="./scarica.html">📲 Scarica l'app</a>
  </nav>

  <main class="container">
    <section class="card month-wrap">
      <div class="month-head">
        <div class="month-name" id="m1"></div>
        <div class="head-right">
          <button type="button" class="arrowbtn" id="prevM" title="Mese precedente">←</button>
          <button type="button" class="arrowbtn" id="todayBtn" title="Torna a oggi" style="font-size:11px;font-weight:700">Oggi</button>
          <button type="button" class="arrowbtn" id="nextM" title="Mese successivo">→</button>
        </div>
      </div>
      <div class="legend small">
        <span class="dot dot-home"></span> Casa
        <span class="dot dot-away" style="margin-left:12px"></span> Trasferta
      </div>

      <div class="month-block">
        <div class="cal-dow"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
        <div id="grid1" class="cal-grid"></div>
      </div>

      <div style="height:6px"></div>

      <div class="month-head">
        <div class="month-name" id="m2"></div>
        <div style="width:68px"></div>
      </div>
      <div class="month-block">
        <div class="cal-dow"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
        <div id="grid2" class="cal-grid"></div>
      </div>
    </section>

    <div id="dayInfoOverlay" class="day-overlay" style="display:none">
      <div id="dayInfoCard" class="day-popup"></div>
    </div>

    <section class="card">
      <h2 style="margin:0 0 8px 0">Prossime partite</h2>
      <div id="futureList"></div>
    </section>

  </main>

  <script defer src="./onboarding.js?v=1"></script>
  <script src="./ui.js?v=35"></script>
  <script defer src="./install-prompt.js?v=2"></script>

  <script type="module">
    import { subscribeMatches } from './data-store.js';

    function wireDrawer(){
      const drawer = document.getElementById('drawer');
      const menuBtn = document.getElementById('menuBtn');
      const closeBtn = document.getElementById('drawer-close');
      if (!drawer || !menuBtn || !closeBtn) return;
      menuBtn.addEventListener('click', (e) => { e.stopPropagation(); drawer.classList.add('open'); });
      closeBtn.addEventListener('click', () => drawer.classList.remove('open'));
      document.addEventListener('click', (e) => {
        if (drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== menuBtn){
          drawer.classList.remove('open');
        }
      });
    }
    wireDrawer();

    const toDate = (d) => {
      if (!d) return new Date('Invalid');
      if (/^\d{4}-\d{2}-\d{2}/.test(d)) return new Date(d);
      const m = d.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
      if (m){ const dd=+m[1], mm=+m[2]-1, yy=(+m[3]<100?2000+ +m[3]:+m[3]); return new Date(yy,mm,dd); }
      const dt = new Date(d);
      return isNaN(+dt) ? new Date('Invalid') : dt;
    };
    const fmtMonth = (d) => d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
    const startDowMon = (y,m) => (new Date(y,m,1).getDay()+6)%7;
    const CORB = 'corbiolo';

    let calData = [];
    let offset = 0;

    function buildTwoMonths(){
      const base = new Date();
      const mA = new Date(base.getFullYear(), base.getMonth()+offset, 1);
      const mB = new Date(base.getFullYear(), base.getMonth()+offset+1, 1);
      buildMonth('grid1','m1', mA);
      buildMonth('grid2','m2', mB);
    }

    function buildMonth(gridId, labelId, baseDate){
      const y = baseDate.getFullYear(), m = baseDate.getMonth();
      document.getElementById(labelId).textContent = fmtMonth(baseDate);
      const grid = document.getElementById(gridId);
      grid.innerHTML = '';

      const leading = startDowMon(y,m);
      for(let i=0;i<leading;i++){
        const c = document.createElement('div'); c.className = 'cal-cell muted'; grid.appendChild(c);
      }

      const nDays = daysInMonth(y,m);
      for(let d=1; d<=nDays; d++){
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = d;

        const dayMatches = calData.filter(e =>
          e.date.getFullYear()===y && e.date.getMonth()===m && e.date.getDate()===d
        );
        if (dayMatches.length){
          cell.classList.add('has');
          cell.classList.add(dayMatches[0].casa_fuori === 'casa' ? 'home' : 'away');
          cell.style.cursor = 'pointer';
          cell.addEventListener('click', ()=> showDayInfo(dayMatches));
          if (dayMatches.some(m => m.speciale === 'Sì')){
            cell.style.boxShadow = '0 0 0 2px #facc15';
            cell.title = (cell.title || '') + ' 🔥 Partita speciale';
          }
        }

        grid.appendChild(cell);
      }
    }

    const dayOverlay = document.getElementById('dayInfoOverlay');
    const dayCard = document.getElementById('dayInfoCard');
    function showDayInfo(matches){
      dayCard.innerHTML = `
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div style="font-weight:800;font-size:15px">${matches.length>1 ? matches.length+' partite in questo giorno' : 'Partita'}</div>
          <span style="cursor:pointer;font-size:20px;color:var(--muted)" id="closeDayInfo">✕</span>
        </div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:12px">
          ${matches.map((match, i) => {
            const icon = match.casa_fuori==='casa' ? '🏠 Casa' : '✈️ Trasferta';
            const s1 = match.casa_fuori==='casa' ? 'Corbiolo' : match.avversario;
            const s2 = match.casa_fuori==='casa' ? match.avversario : 'Corbiolo';
            const ds = match.date.toLocaleDateString(undefined,{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
            const tipoTag = match.tipo && match.tipo!=='Campionato' ? `<span class="pill" style="margin-left:6px">${match.tipo}</span>` : '';
            const specialeTag = match.speciale==='Sì' ? `<span class="pill" style="margin-left:6px;background:#facc15;color:#3a2f00">🔥 Da non perdere</span>` : '';
            return `
              <div style="${i>0 ? 'border-top:1px solid var(--ring);padding-top:12px' : ''}">
                <div style="font-weight:800;font-size:16px">${s1} - ${s2} ${tipoTag} ${specialeTag}</div>
                <div class="small" style="margin-top:6px">${icon} · ${ds}${match.ora ? ' · '+match.ora : ''}</div>
                ${match.risultato ? `<div style="font-weight:800;margin-top:8px">Risultato: ${match.risultato}</div>` : ''}
              </div>`;
          }).join('')}
        </div>`;
      dayOverlay.style.display = 'flex';
      document.getElementById('closeDayInfo').onclick = ()=> dayOverlay.style.display='none';
    }
    dayOverlay.addEventListener('click', (e)=>{ if (e.target === dayOverlay) dayOverlay.style.display='none'; });

    document.getElementById('prevM').addEventListener('click', ()=>{
      offset -= 1; buildTwoMonths(); window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('nextM').addEventListener('click', ()=>{
      offset += 1; buildTwoMonths(); window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('todayBtn').addEventListener('click', ()=>{
      offset = 0; buildTwoMonths(); window.scrollTo({top:0,behavior:'smooth'});
    });

    const isHome = m => (m.casa||'').trim().toLowerCase() === CORB;
    const fmtListDate = (d) => d.toLocaleDateString(undefined,{weekday:'short', day:'2-digit', month:'short'});
    const list = document.getElementById('futureList');
    let allMatchesRaw = []; // tutte le partite di tutte le squadre, per il popup "tutta la giornata"

    subscribeMatches((allRowsRaw) => {
      allMatchesRaw = allRowsRaw || [];
      const rows = (allRowsRaw||[]).filter(m => (m.casa||'').trim().toLowerCase()==='corbiolo' || (m.fuori||'').trim().toLowerCase()==='corbiolo');
      const matches = (rows||[]).map(m=>({
        ...m,
        date: new Date((m.data||'')+'T'+(m.ora||'00:00'))
      })).filter(m=>!isNaN(+m.date));

      calData = matches.map(m => ({
        date: m.date,
        avversario: isHome(m) ? (m.fuori||'Avversario') : (m.casa||'Avversario'),
        casa_fuori: isHome(m) ? 'casa' : 'fuori',
        tipo: m.tipo || '',
        ora: m.ora || '',
        risultato: m.risultato || '',
        giornata: m.giornata || '',
        stagione: m.stagione || '',
        speciale: m.speciale || 'No'
      }));
      buildTwoMonths();

      const now = new Date();
      const futures = matches.filter(m=> m.date > now).sort((a,b)=> a.date - b.date);
      list.innerHTML = futures.length ? futures.map(m=>{
        const homeSide = isHome(m);
        const s1 = homeSide ? 'Corbiolo' : (m.casa||'Avversario');
        const s2 = homeSide ? (m.fuori||'Avversario') : 'Corbiolo';
        const icon = homeSide ? '🏠' : '✈️';
        const ds = fmtListDate(m.date);
        const tipoTxt = m.tipo && m.tipo!=='Campionato' ? ` · ${m.tipo}` : '';
        return `
          <div class="future-row">
            <div class="row">
              <span class="pill" style="margin-right:6px">${icon}</span>
              <div>
                <div><strong>${s1} - ${s2}</strong></div>
                <div class="small">${ds}${tipoTxt}</div>
              </div>
            </div>
          </div>`;
      }).join('') : '<div class="small">Nessuna partita in programma</div>';
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
