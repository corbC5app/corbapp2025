<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <script>(function(){var a=localStorage.getItem("corb-theme-auto");if(a===null)a="on";var t;if(a==="on"){var h=new Date().getHours();t=(h>=19||h<7)?"dark":"light";}else{t=localStorage.getItem("corb-theme")||"light";}document.documentElement.dataset.theme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Calendario - CORBIOLOC5</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/logo_c5.png">
  <link rel="stylesheet" href="./style.css?v=35">
  <style>
    .container{gap:8px}
    body{overflow-x:hidden}
    .month-wrap{margin-bottom:10px;padding:12px}
    .month-head{display:flex;align-items:center;justify-content:space-between}
    .month-name{font-weight:900;line-height:1.05;font-size:clamp(15px,4.5vw,20px)}
    .head-right{display:flex;gap:6px}
    .arrowbtn{border-radius:9px;border:1px solid var(--ring);background:var(--card);padding:3px 8px;font-size:13px}
    .legend{display:flex;gap:16px;align-items:center;margin-top:4px}
    .dot{width:9px;height:9px;border-radius:999px}
    .dot-home{background:var(--home)} .dot-away{background:var(--away)}
    .cal-dow{margin:6px 0 4px;gap:4px;font-size:11px}
    .cal-grid{gap:4px}
    .cal-cell{border-radius:8px;font-size:clamp(10px,2.8vw,13px)}
    .month-block{margin-bottom:4px}
    #futureList .future-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ring)}
    #futureList .future-row:last-child{border-bottom:0}
    #futureList .tinyLogo{width:34px;height:34px;border-radius:10px;object-fit:contain;flex-shrink:0}
    #futureList .teamName{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    #futureList .when{grid-column:1/-1;color:var(--muted);font-size:13px;margin-top:6px}
    :root[data-theme="dark"] .arrowbtn{color:#fff}
    .day-overlay{
      position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .day-popup{
      background:var(--card);color:var(--text);border-radius:16px;padding:18px;
      max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);
      animation:day-pop .15s ease-out;
    }
    #matchDetailCard{display:flex;flex-direction:column;max-height:85vh;overflow:hidden}
    #matchDetailCard>*{flex-shrink:0}
    #matchDetailCard>.md-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    @keyframes day-pop{ from{ transform:scale(.92); opacity:0 } to{ transform:scale(1); opacity:1 } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a href="./index.html" class="brand" aria-label="Home">
        <img src="img/logo_c5.png" alt="Corbiolo" class="brand-logo">
        <span class="title">Calendario</span>
      </a>
    </div>
    <div class="right">
      <button type="button" id="menuBtn" class="iconbtn" aria-label="Apri menu" title="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="drawer" class="drawer" aria-label="Menu laterale">
    <button type="button" id="drawer-close" class="drawer-close" aria-label="Chiudi">✕</button>
    <h3>Menu</h3>
    <a href="./index.html">🏠 Home</a>
    <a href="./news.html">📰 News</a>
    <a href="./squadra.html">👥 Squadra</a>
    <a href="./video.html">🎥 Video</a>
    <a href="./prossima.html">📅 Prossima partita</a>
    <a href="./partite.html">🏆 Risultati</a>
    <a href="./calendario.html">📆 Calendario</a>
    <a href="./competizioni.html">📋 Competizioni</a>
    <a href="./classifica.html">🏅 Classifica</a>
    <a href="./dove.html">📍 Dove si gioca</a>
    <a href="./settings.html">🔔 Impostazioni</a>
    <a href="./admin.html">⚙️ Admin</a>
    <hr style="border:none;border-top:1px solid var(--ring);margin:10px 0">
    <a href="./scarica.html">📲 Scarica l'app</a>
  </nav>

  <main class="container">
    <section class="card month-wrap">
      <div class="month-head">
        <div class="month-name" id="m1"></div>
        <div class="head-right">
          <button type="button" class="arrowbtn" id="prevM" title="Mese precedente">←</button>
          <button type="button" class="arrowbtn" id="todayBtn" title="Torna a oggi" style="font-size:11px;font-weight:700">Oggi</button>
          <button type="button" class="arrowbtn" id="nextM" title="Mese successivo">→</button>
        </div>
      </div>
      <div class="legend small">
        <span class="dot dot-home"></span> Casa
        <span class="dot dot-away" style="margin-left:12px"></span> Trasferta
      </div>

      <div class="month-block">
        <div class="cal-dow"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
        <div id="grid1" class="cal-grid"></div>
      </div>

      <div style="height:6px"></div>

      <div class="month-head">
        <div class="month-name" id="m2"></div>
        <div style="width:68px"></div>
      </div>
      <div class="month-block">
        <div class="cal-dow"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
        <div id="grid2" class="cal-grid"></div>
      </div>
    </section>

    <div id="dayInfoOverlay" class="day-overlay" style="display:none">
      <div id="dayInfoCard" class="day-popup"></div>
    </div>

    <div id="matchDetailOverlay" class="day-overlay" style="display:none">
      <div id="matchDetailCard" class="day-popup"></div>
    </div>

    <section class="card">
      <h2 style="margin:0 0 8px 0">Prossime partite</h2>
      <div id="futureList"></div>
    </section>

  </main>

  <script defer src="./onboarding.js?v=1"></script>
  <script src="./ui.js?v=35"></script>
  <script defer src="./install-prompt.js?v=2"></script>

  <script type="module">
    import { subscribeMatches } from './data-store.js';

    function wireDrawer(){
      const drawer = document.getElementById('drawer');
      const menuBtn = document.getElementById('menuBtn');
      const closeBtn = document.getElementById('drawer-close');
      if (!drawer || !menuBtn || !closeBtn) return;
      menuBtn.addEventListener('click', (e) => { e.stopPropagation(); drawer.classList.add('open'); });
      closeBtn.addEventListener('click', () => drawer.classList.remove('open'));
      document.addEventListener('click', (e) => {
        if (drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== menuBtn){
          drawer.classList.remove('open');
        }
      });
    }
    wireDrawer();

    const toDate = (d) => {
      if (!d) return new Date('Invalid');
      if (/^\d{4}-\d{2}-\d{2}/.test(d)) return new Date(d);
      const m = d.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
      if (m){ const dd=+m[1], mm=+m[2]-1, yy=(+m[3]<100?2000+ +m[3]:+m[3]); return new Date(yy,mm,dd); }
      const dt = new Date(d);
      return isNaN(+dt) ? new Date('Invalid') : dt;
    };
    const fmtMonth = (d) => d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
    const startDowMon = (y,m) => (new Date(y,m,1).getDay()+6)%7;
    const CORB = 'corbiolo';

    let calData = [];
    let corbMatches = []; // partite del Corbiolo con oggetto Date pronto, per la lista sotto
    let offset = 0;

    function buildTwoMonths(){
      const base = new Date();
      const mA = new Date(base.getFullYear(), base.getMonth()+offset, 1);
      const mB = new Date(base.getFullYear(), base.getMonth()+offset+1, 1);
      buildMonth('grid1','m1', mA);
      buildMonth('grid2','m2', mB);
      renderFutureList(mA, mB);
    }

    const badge = (name, url, size) => (typeof window.teamBadgeHTML === 'function')
      ? window.teamBadgeHTML(name, url, size)
      : `<div style="width:${size}px;height:${size}px;border-radius:22%;background:#ccc;flex-shrink:0"></div>`;

    function renderFutureList(mA, mB){
      if (!mA){ // primissima chiamata prima che buildTwoMonths giri almeno una volta
        const base = new Date();
        mA = new Date(base.getFullYear(), base.getMonth()+offset, 1);
        mB = new Date(base.getFullYear(), base.getMonth()+offset+1, 1);
      }
      const inizio = new Date(mA.getFullYear(), mA.getMonth(), 1);
      const fine = new Date(mB.getFullYear(), mB.getMonth()+1, 0, 23, 59, 59);

      const now = new Date();
      const futures = corbMatches
        .filter(m => m.date >= inizio && m.date <= fine && m.date > now)
        .sort((a,b)=> a.date - b.date);

      list.innerHTML = futures.length ? futures.map(m=>{
        const homeName = (m.casa || 'Corbiolo').trim();
        const awayName = (m.fuori || 'Avversario').trim();
        const homeBadge = homeName.toLowerCase()===CORB ? `<img class="tinyLogo" src="img/logo_c5.png" alt="">` : badge(homeName, m.logo_casa, 28);
        const awayBadge = awayName.toLowerCase()===CORB ? `<img class="tinyLogo" src="img/logo_c5.png" alt="">` : badge(awayName, m.logo_fuori, 28);
        const ds = fmtListDate(m.date);
        const trasfertaIcon = isHome(m) ? '🏠' : '✈️';

        return `
          <div class="future-row">
            ${homeBadge}
            <div class="teamName">${homeName}</div>
            ${awayBadge}
            <div class="teamName">${awayName}</div>
            <div class="when">${trasfertaIcon} ${ds}${m.ora ? ' · '+m.ora : ''} · ${m.tipo || 'Campionato'}</div>
          </div>`;
      }).join('') : '<div class="small">Nessuna partita in questi due mesi</div>';
    }

    function buildMonth(gridId, labelId, baseDate){
      const y = baseDate.getFullYear(), m = baseDate.getMonth();
      document.getElementById(labelId).textContent = fmtMonth(baseDate);
      const grid = document.getElementById(gridId);
      grid.innerHTML = '';

      const leading = startDowMon(y,m);
      for(let i=0;i<leading;i++){
        const c = document.createElement('div'); c.className = 'cal-cell muted'; grid.appendChild(c);
      }

      const nDays = daysInMonth(y,m);
      for(let d=1; d<=nDays; d++){
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = d;

        const dayMatches = calData.filter(e =>
          e.date.getFullYear()===y && e.date.getMonth()===m && e.date.getDate()===d
        );
        if (dayMatches.length){
          cell.classList.add('has');
          cell.classList.add(dayMatches[0].casa_fuori === 'casa' ? 'home' : 'away');
          cell.style.cursor = 'pointer';
          cell.addEventListener('click', ()=> showDayInfo(dayMatches));
          if (dayMatches.some(m => m.speciale === 'Sì')){
            cell.style.boxShadow = '0 0 0 2px #facc15';
            cell.title = (cell.title || '') + ' 🔥 Partita speciale';
          }
        }

        grid.appendChild(cell);
      }
    }

    const dayOverlay = document.getElementById('dayInfoOverlay');
    const dayCard = document.getElementById('dayInfoCard');
    function showDayInfo(matches){
      const single = matches.length === 1;
      const headerTipoTag = single ? `<span class="pill" style="margin-left:6px">${matches[0].tipo || 'Campionato'}</span>` : '';
      dayCard.innerHTML = `
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div style="font-weight:800;font-size:15px">${matches.length>1 ? matches.length+' partite in questo giorno' : 'Partita'}${headerTipoTag}</div>
          <span style="cursor:pointer;font-size:20px;color:var(--muted)" id="closeDayInfo">✕</span>
        </div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:12px">
          ${matches.map((match, i) => {
            const icon = match.casa_fuori==='casa' ? '🏠 Casa' : '✈️ Trasferta';
            const s1 = match.casa_fuori==='casa' ? 'Corbiolo' : match.avversario;
            const s2 = match.casa_fuori==='casa' ? match.avversario : 'Corbiolo';
            const ds = match.date.toLocaleDateString(undefined,{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
            const tipoTag = single ? '' : `<span class="pill" style="margin-left:6px">${match.tipo || 'Campionato'}</span>`;
            const specialeTag = match.speciale==='Sì' ? `<span class="pill" style="margin-left:6px;background:#facc15;color:#3a2f00">🔥 Da non perdere</span>` : '';
            return `
              <div style="${i>0 ? 'border-top:1px solid var(--ring);padding-top:12px' : ''}">
                <div style="font-weight:800;font-size:16px">${s1} - ${s2} ${tipoTag} ${specialeTag}</div>
                <div class="small" style="margin-top:6px">${icon} · ${ds}${match.ora ? ' · '+match.ora : ''}</div>
                ${match.risultato ? `
                  <div class="row" style="justify-content:space-between;align-items:center;margin-top:8px">
                    <div style="font-weight:800">Risultato: ${match.risultato}</div>
                    <button class="btn btn-ghost" data-cronaca-id="${match.id}" style="font-size:12px;padding:5px 10px">📓 Vedi cronaca</button>
                  </div>` : ''}
              </div>`;
          }).join('')}
        </div>`;
      dayOverlay.style.display = 'flex';
      document.getElementById('closeDayInfo').onclick = ()=> dayOverlay.style.display='none';
      dayCard.querySelectorAll('[data-cronaca-id]').forEach(btn=>{
        btn.onclick = ()=>{
          const full = allMatchesRaw.find(m => m.id === btn.dataset.cronacaId);
          if (full) showMatchDetail(full);
        };
      });
    }
    dayOverlay.addEventListener('click', (e)=>{ if (e.target === dayOverlay) dayOverlay.style.display='none'; });

    const matchDetailOverlay = document.getElementById('matchDetailOverlay');
    const matchDetailCard = document.getElementById('matchDetailCard');
    matchDetailOverlay.addEventListener('click', (e)=>{ if (e.target === matchDetailOverlay) matchDetailOverlay.style.display='none'; });

    // Cronaca a timeline: linea centrale, squadra di casa a sinistra, ospite a destra, più recenti in alto
    function cronacaHTML(eventi, homeName, awayName){
      const H = (homeName||'').trim().toLowerCase();
      const dots = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;border:1px solid #bbb;vertical-align:middle;margin:0 1px 1px 0"></span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#6b0f1a;vertical-align:middle;margin:0 3px 1px 0"></span>';
      const COLS = 'grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr)';
      const line = (bottom) => `<div style="position:absolute;top:0;bottom:${bottom||0};left:50%;border-left:2px dotted var(--ring)"></div>`;
      const circle = (ico) => `<div style="position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--card,#fff);border:1px solid var(--ring);display:flex;align-items:center;justify-content:center;font-size:15px">${ico}</div>`;
      const center = (ico, bottom) => `<div style="position:relative;display:flex;align-items:center;justify-content:center;align-self:stretch">${line(bottom)}${circle(ico)}</div>`;
      let lastScore = '0 - 0';
      const rows = [];
      eventi.forEach(e=>{
        const s = String(e).replace(/\s*\(\s*60\s*['’"]{1,2}\s*di pausa\s*\)/i,'').trim(); // toglie "(60'' di pausa)" anche dai time-out già registrati
        const i = s.lastIndexOf(' — ');
        if (i < 0){
          const label = s.replace(/^—\s*/,'').replace(/\s*—$/,'');
          rows.push(`<div style="display:grid;${COLS};align-items:center"><div style="grid-column:1 / 4;text-align:center;padding:10px 0;font-weight:800;font-size:14px">${label} <span style="font-weight:600;margin-left:6px">${lastScore}</span></div></div>`);
          return;
        }
        let body = s.slice(0, i).trim();
        const team = s.slice(i + 3).trim();
        let time = '', per = '';
        const t = body.match(/^(\S+)\s+(\d+)['’]\s+(.*)$/);
        if (t){ per = t[1]; time = t[2] + "'"; body = t[3]; }
        const m = body.match(/^(\S+)\s+(.*)$/);
        const ico = m ? m[1] : '•';
        const txt = m ? m[2] : body;
        const sc = txt.match(/^(\d+)\s*[-–]\s*(\d+)/);
        if (sc) lastScore = sc[1] + ' - ' + sc[2];
        const isCorb = team.toLowerCase() === 'corbiolo';
        const who = `<div style="font-size:13px;font-weight:600;line-height:1.25;word-break:break-word">${txt}</div>`;
        const tm = `<div><span style="font-size:14px;font-weight:800">${time}</span> <span style="font-size:11px;color:var(--muted);margin-left:3px">${per}</span></div>`;
        const left = team.toLowerCase() === H;
        rows.push(`<div style="display:grid;${COLS};align-items:center">`
          + (left
              ? `<div style="padding:7px 4px 7px 0;text-align:right">${who}</div>${center(ico)}<div style="padding:7px 0 7px 4px">${tm}</div>`
              : `<div style="padding:7px 4px 7px 0;text-align:right">${tm}</div>${center(ico)}<div style="padding:7px 0 7px 4px">${who}</div>`)
          + `</div>`);
      });
      if (rows.length){
        rows.reverse(); // più recenti in alto
        rows.push(`<div style="display:grid;${COLS};align-items:center"><div></div>${center('⏱️','50%')}<div style="padding:0 0 0 4px;font-size:11px;color:var(--muted)">Inizio</div></div>`);
      }
      return rows.join('');
    }

    function showMatchDetail(m){
      const homeName = (m.casa || 'Corbiolo').trim();
      const awayName = (m.fuori || 'Avversario').trim();
      const homeBadge = homeName.toLowerCase()===CORB
        ? `<img src="img/logo_c5.png" style="width:44px;height:44px;border-radius:10px;object-fit:contain" alt="">`
        : badge(homeName, m.logo_casa, 44);
      const awayBadge = awayName.toLowerCase()===CORB
        ? `<img src="img/logo_c5.png" style="width:44px;height:44px;border-radius:10px;object-fit:contain" alt="">`
        : badge(awayName, m.logo_fuori, 44);
      const eventi = Array.isArray(m.eventi) ? m.eventi : [];

      matchDetailCard.innerHTML = `
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div class="small">${m.tipo || 'Campionato'}</div>
          <span style="cursor:pointer;font-size:20px;color:var(--muted)" id="closeMatchDetail">✕</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:84px">
            ${homeBadge}<span style="font-size:12px;text-align:center;font-weight:700">${homeName}</span>
          </div>
          <div style="font-size:26px;font-weight:900">${m.risultato||'-'}</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:84px">
            ${awayBadge}<span style="font-size:12px;text-align:center;font-weight:700">${awayName}</span>
          </div>
        </div>
        <div style="margin-top:12px;border-top:2px solid var(--ring)"></div>
        <div class="md-scroll">
        <div style="padding-top:8px">
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px">CRONACA</div>
          <div>
            ${eventi.length
              ? cronacaHTML(eventi, homeName, awayName)
              : '<div class="small" style="padding:6px 0">Nessuna cronaca registrata per questa partita.</div>'}
          </div>
        </div>
        ${m.commento ? `
        <div style="margin-top:12px;border-top:1px solid var(--ring);padding-top:8px">
          <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px">COMMENTO</div>
          <div style="font-size:13px;line-height:1.5">${m.commento}</div>
        </div>` : ''}
        </div>`;
      matchDetailOverlay.style.display = 'flex';
      document.getElementById('closeMatchDetail').onclick = ()=> matchDetailOverlay.style.display='none';
    }

    document.getElementById('prevM').addEventListener('click', ()=>{
      offset -= 1; buildTwoMonths(); window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('nextM').addEventListener('click', ()=>{
      offset += 1; buildTwoMonths(); window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('todayBtn').addEventListener('click', ()=>{
      offset = 0; buildTwoMonths(); window.scrollTo({top:0,behavior:'smooth'});
    });

    const isHome = m => (m.casa||'').trim().toLowerCase() === CORB;
    const fmtListDate = (d) => d.toLocaleDateString(undefined,{weekday:'short', day:'2-digit', month:'short'});
    const list = document.getElementById('futureList');
    let allMatchesRaw = []; // tutte le partite di tutte le squadre, per il popup "tutta la giornata"

    subscribeMatches((allRowsRaw) => {
      allMatchesRaw = allRowsRaw || [];
      const rows = (allRowsRaw||[]).filter(m => (m.casa||'').trim().toLowerCase()==='corbiolo' || (m.fuori||'').trim().toLowerCase()==='corbiolo');
      const matches = (rows||[]).map(m=>({
        ...m,
        date: new Date((m.data||'')+'T'+(m.ora||'00:00'))
      })).filter(m=>!isNaN(+m.date));

      calData = matches.map(m => ({
        id: m.id,
        date: m.date,
        avversario: isHome(m) ? (m.fuori||'Avversario') : (m.casa||'Avversario'),
        casa_fuori: isHome(m) ? 'casa' : 'fuori',
        tipo: m.tipo || '',
        ora: m.ora || '',
        risultato: m.risultato || '',
        giornata: m.giornata || '',
        stagione: m.stagione || '',
        speciale: m.speciale || 'No'
      }));
      corbMatches = matches;
      buildTwoMonths();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
