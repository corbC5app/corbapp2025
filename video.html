<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <script>(function(){var a=localStorage.getItem("corb-theme-auto");if(a===null)a="on";var t;if(a==="on"){var h=new Date().getHours();t=(h>=19||h<7)?"dark":"light";}else{t=localStorage.getItem("corb-theme")||"light";}document.documentElement.dataset.theme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Video - CORBIOLOC5</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/logo_c5.png">
  <link rel="stylesheet" href="./style.css?v=35">
  <style>
    body{overflow-x:hidden}
    .video-list{display:grid;gap:14px}
    .season-block{
      border:1px solid var(--ring);border-radius:16px;overflow:hidden;
      background:var(--card);
    }
    .season-header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      background:none;border:0;
      padding:16px;font-weight:900;font-size:17px;color:var(--text);cursor:pointer;text-align:left
    }
    .season-header .chevron{font-size:13px;color:var(--muted);flex-shrink:0;margin-left:8px}
    .season-content{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px 12px 12px}
    .season-content > .video-card{grid-column:1 / -1} /* video senza partita riconosciuta: a tutta larghezza come prima */

    /* Quadrato partita: giornata sopra, sotto logo casa - risultato - logo fuori */
    .vsq{
      aspect-ratio:1/1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
      padding:6px 4px;border:1px solid var(--ring);border-radius:14px;background:var(--card);
      color:var(--text);text-decoration:none;box-shadow:0 1px 5px rgba(0,0,0,.08);
    }
    .vsq-top{font-size:11px;font-weight:800;color:var(--muted);text-align:center;line-height:1.15}
    .vsq-row{display:flex;align-items:center;justify-content:center;gap:3px;max-width:100%}
    .vsq-score{font-size:14px;font-weight:900;white-space:nowrap}
    .video-card{overflow:hidden;max-width:100%}
    .video-card .title{font-weight:700;margin:8px 0 4px 0;overflow-wrap:break-word;word-break:break-word}
    .video-card a.small{overflow-wrap:break-word;word-break:break-word}
    .ratio{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#eee}
    .ratio::before{content:"";display:block;padding-top:56.25%}
    .ratio > iframe, .ratio > img{position:absolute;inset:0;width:100%;height:100%;border:0}

    /* L'embed Instagram porta il proprio sfondo bianco (non lo controlliamo noi,
       è dentro il loro iframe) — lo inquadriamo in un riquadro chiaro sempre
       coerente, anche col tema scuro, invece di un contrasto netto e brutto. */
    .instagram-media{
      max-width:100% !important; width:100% !important;
      margin:0 !important; border-radius:12px !important; overflow:hidden;
    }
    .ig-wrap{background:#fafafa;border-radius:12px;padding:1px;display:flex;justify-content:center;overflow:hidden}
    :root[data-theme="dark"] .ig-wrap{background:#e8e8e8}
  </style>
</head>
<body>

    <div class="nav">
      <a href="./index.html" class="brand">
        <img src="img/logo_c5.png" alt="Corbiolo" class="brand-logo">
        <span class="title">Video</span>
      </a>
    </div>
    <div class="right">
      <button type="button" id="menuBtn" class="iconbtn" aria-label="Menu" title="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="drawer" class="drawer">
    <button type="button" id="drawer-close" class="drawer-close" aria-label="Chiudi">✕</button>
    <h3>Menu</h3>
    <a href="./index.html">🏠 Home</a>
    <a href="./news.html">📰 News</a>
    <a href="./squadra.html">👥 Squadra</a>
    <a href="./video.html">🎥 Video</a>
    <a href="./prossima.html">📅 Prossima partita</a>
    <a href="./partite.html">🏆 Risultati</a>
    <a href="./calendario.html">📆 Calendario</a>
    <a href="./competizioni.html">📋 Competizioni</a>
    <a href="./classifica.html">🏅 Classifica</a>
    <a href="./dove.html">📍 Dove si gioca</a>
    <a href="./settings.html">🔔 Impostazioni</a>

  </nav>

  <main class="container">
    <section class="card">
      <h2 style="margin:0 0 8px 0">Ultimi video</h2>
      <div id="videos" class="video-list"></div>
    </section>
  </main>

  <script>
    (function(){
      var drawer = document.getElementById('drawer');
      var menuBtn = document.getElementById('menuBtn');
      var closeBtn = document.getElementById('drawer-close');
      menuBtn.addEventListener('click', function(e){ e.stopPropagation(); drawer.classList.add('open'); });
      closeBtn.addEventListener('click', function(){ drawer.classList.remove('open'); });
      document.addEventListener('click', function(e){
        if (drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== menuBtn){
          drawer.classList.remove('open');
        }
      });
    })();
  </script>

  <script defer src="./onboarding.js?v=1"></script>
  <script src="./ui.js?v=35"></script>
  <script defer src="./install-prompt.js?v=2"></script>

  <script type="module">
    import { subscribeVideos, subscribeMatches, currentSeason } from './data-store.js';

    const box = document.getElementById('videos');
    const openSeasons = {}; // ricordo quali sezioni sono aperte tra un aggiornamento e l'altro

    const isYouTube = (u)=> /youtube\.com\/watch\?v=|youtu\.be\//i.test(u||'');
    const isInstagram = (u)=> /instagram\.com\/(p|reel|tv)\//i.test(u||'');
    const ytId = (u)=>{
      if (!u) return '';
      const m1 = u.match(/[?&]v=([^&]+)/); if (m1) return m1[1];
      const m2 = u.match(/youtu\.be\/([^?&]+)/); if (m2) return m2[1];
      return '';
    };

    // ==== QUADRATI ====
    // Dal titolo "Casa/Fuori (x-y)" ricavo le due squadre, poi cerco la partita nel
    // calendario (stessa stagione, stesso tipo, Corbiolo dallo stesso lato) per avere
    // numero di giornata e loghi. Se non la trovo il quadrato si vede lo stesso.
    let matchesCache = [];
    let videosCache = [];

    const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[.'’]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
    const isCorb = s => norm(s).includes('corbiolo');
    const bigrams = s => { const t=' '+s+' '; const a=[]; for(let i=0;i<t.length-1;i++) a.push(t.slice(i,i+2)); return a; };
    function sim(a,b){
      a = norm(a); b = norm(b);
      if (!a || !b) return 0;
      if (a === b) return 1;
      const A = bigrams(a), B = bigrams(b), cnt = {};
      A.forEach(x => cnt[x] = (cnt[x]||0) + 1);
      let inter = 0;
      B.forEach(x => { if (cnt[x] > 0){ cnt[x]--; inter++; } });
      const dice = 2*inter / (A.length + B.length);
      return (a.includes(b) || b.includes(a)) ? Math.max(dice, 0.8) : dice; // tollera typo e "Asd"/"A.S.D." in più
    }

    function parseTitolo(t){
      const m = String(t||'').match(/^\s*(.+?)\s*\/\s*(.+?)\s*(?:\(\s*(\d+)\s*[-–]\s*(\d+)\s*\))?\s*$/);
      if (!m) return null;
      return { casa:m[1], fuori:m[2], gc: m[3]!=null ? +m[3] : null, gf: m[4]!=null ? +m[4] : null };
    }

    function trovaPartita(v, p){
      const cat = (v.stagione||'').toLowerCase();
      const y = (cat.match(/(\d{4})\s*\/\s*\d{2,4}/)||[])[1];
      const tipo = cat.includes('coppa') ? 'Coppa' : cat.includes('amichevol') ? 'Amichevole' : cat.includes('campionato') ? 'Campionato' : null;
      const casaIsCorb = isCorb(p.casa);
      const opp = casaIsCorb ? p.fuori : p.casa;
      let best = null, bestScore = 0;
      matchesCache.forEach(m => {
        if (y && !String(m.stagione||'').startsWith(y)) return;
        if (tipo && (m.tipo||'Campionato') !== tipo) return;
        const mCasaCorb = isCorb(m.casa || 'Corbiolo');
        if (mCasaCorb !== casaIsCorb) return;
        let sc = sim(opp, mCasaCorb ? (m.fuori||'') : (m.casa||''));
        if (sc < 0.5) return;
        if (p.gc != null && m.risultato && String(m.risultato).replace(/\s/g,'') === `${p.gc}-${p.gf}`) sc += 0.5; // andata/ritorno: scelgo quella col risultato giusto
        if (sc > bestScore){ best = m; bestScore = sc; }
      });
      return best;
    }

    const badge = (name, url, size) => isCorb(name)
      ? `<img src="img/logo_c5.png" alt="" style="width:${size}px;height:${size}px;border-radius:22%;object-fit:contain;background:#fff;flex-shrink:0">`
      : (typeof window.teamBadgeHTML === 'function')
        ? window.teamBadgeHTML(name, url, size)
        : `<div style="width:${size}px;height:${size}px;border-radius:22%;background:#ccc;flex-shrink:0"></div>`;

    function quadrato(v){
      const p = parseTitolo(v.nome);
      if (!p) return null; // titolo non nel formato "Casa/Fuori": resta la card di prima
      const m = trovaPartita(v, p);
      const casa  = m ? (m.casa  || 'Corbiolo')   : p.casa;
      const fuori = m ? (m.fuori || 'Avversario') : p.fuori;

      let score = '–';
      const rm = m && m.risultato ? String(m.risultato).match(/(\d+)\s*[-–]\s*(\d+)/) : null;
      if (rm) score = `${rm[1]}-${rm[2]}`;
      else if (p.gc != null) score = `${p.gc}-${p.gf}`;

      let label = '–';
      if (m){
        const t = m.tipo || 'Campionato';
        label = t === 'Coppa' ? (m.fase || 'Coppa')
              : t === 'Amichevole' ? 'Amichevole'
              : (m.giornata ? `${m.giornata}ª giornata` : '–');
      }

      const inner = `<div class="vsq-top">${label}</div>`
        + `<div class="vsq-row">${badge(casa, m && m.logo_casa, 24)}<span class="vsq-score">${score}</span>${badge(fuori, m && m.logo_fuori, 24)}</div>`;
      return v.link
        ? `<a class="vsq" href="${v.link}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="vsq">${inner}</div>`;
    }
    // ==== FINE QUADRATI ====

    function card(v){
      const titolo = v.nome || 'Video';
      const thumb = v.logo ? (v.logo.startsWith('http') ? v.logo : `img/${v.logo}`) : '';
      const link  = v.link || '';

      if (isInstagram(link)){
        return `
          <a class="card video-card" href="${link}" target="_blank" rel="noopener"
            style="display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;gap:10px">
            <div class="title" style="margin:0">🎥 ${titolo}</div>
            <span style="font-size:20px;flex-shrink:0">➜</span>
          </a>`;
      } else if (isYouTube(link)){
        const id = ytId(link);
        const src = `https://www.youtube.com/embed/${id}`;
        return `
          <article class="card video-card">
            <div class="ratio"><iframe src="${src}" allowfullscreen loading="lazy"></iframe></div>
            <div class="title">${titolo}</div>
            <a class="small" href="${link}" target="_blank" rel="noopener">▶️ Apri su YouTube</a>
          </article>`;
      } else {
        return `
          <article class="card video-card">
            <a href="${link}" target="_blank" rel="noopener">
              <div class="ratio">
                ${thumb ? `<img src="${thumb}" alt="" onerror="this.style.display='none'">` : ''}
              </div>
            </a>
            <div class="title">${titolo}</div>
            ${link ? `<a class="small" href="${link}" target="_blank" rel="noopener">▶️ Guarda il video</a>` : ''}
          </article>`;
      }
    }

    function renderVideos(){
      const rows = videosCache || [];
      const bySeason = {};
      rows.forEach(v => {
        const s = v.stagione || currentSeason();
        (bySeason[s] = bySeason[s] || []).push(v);
      });

      const seasons = Object.keys(bySeason).sort((a,b) => b.localeCompare(a)); // più recente prima
      if (!seasons.length){
        box.innerHTML = `<div class="small">Nessun video disponibile.</div>`;
        return;
      }

      const tipoIcon = (s)=>{
        const t = (s||'').toLowerCase();
        if (t.includes('coppa')) return '🏅';
        if (t.includes('amichevol')) return '🤝';
        return '🏆';
      };

      box.innerHTML = seasons.map(s => {
        const tsV = (x)=>{ const c=x.createdAt; return c && typeof c.toMillis==='function' ? c.toMillis() : (c && c.seconds ? c.seconds*1000 : 0); };
        const videos = bySeason[s].slice().sort((a,b) => tsV(b) - tsV(a)); // più recente prima
        const isOpen = !!openSeasons[s];
        return `
          <div class="season-block">
            <button type="button" class="season-header" data-season="${s}">
              <span>${tipoIcon(s)} ${s} <span class="small" style="font-weight:400">(${videos.length})</span></span>
              <span class="chevron">${isOpen ? '▲' : '▼'}</span>
            </button>
            <div class="season-content" style="display:${isOpen ? 'grid' : 'none'}">
              ${videos.map(v => quadrato(v) || card(v)).join('')}
            </div>
          </div>`;
      }).join('');

      box.querySelectorAll('.season-header').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = btn.dataset.season;
          openSeasons[s] = !openSeasons[s];
          renderVideos();
        });
      });
    }

    // 👇 si aggiorna da solo appena l'admin aggiunge/modifica un video
    subscribeVideos(list => { videosCache = list || []; renderVideos(); });
    subscribeMatches(list => { matchesCache = list || []; renderVideos(); }); // quando arrivano le partite aggiorno giornate e loghi

    localStorage.setItem('corb-seen-video', String(Date.now()));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
