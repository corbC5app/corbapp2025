<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <script>(function(){var a=localStorage.getItem("corb-theme-auto");if(a===null)a="on";var t;if(a==="on"){var h=new Date().getHours();t=(h>=19||h<7)?"dark":"light";}else{t=localStorage.getItem("corb-theme")||"light";}document.documentElement.dataset.theme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Video - CORBIOLOC5</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/logo_c5.png">
  <link rel="stylesheet" href="./style.css?v=35">
  <style>
    .video-list{display:grid;gap:12px}
    .video-card{overflow:hidden}
    .video-card .title{font-weight:700;margin:8px 0 4px 0;overflow-wrap:break-word;word-break:break-word}
    .video-card a.small{overflow-wrap:break-word;word-break:break-word}
    .ratio{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#eee}
    .ratio::before{content:"";display:block;padding-top:56.25%}
    .ratio > iframe, .ratio > img{position:absolute;inset:0;width:100%;height:100%;border:0}

    /* L'embed Instagram porta il proprio sfondo bianco (non lo controlliamo noi,
       è dentro il loro iframe) — lo inquadriamo in un riquadro chiaro sempre
       coerente, anche col tema scuro, invece di un contrasto netto e brutto. */
    .instagram-media{
      max-width:100% !important; width:100% !important;
      margin:0 !important; border-radius:12px !important; overflow:hidden;
    }
    .ig-wrap{background:#fafafa;border-radius:12px;padding:1px;display:flex;justify-content:center;overflow:hidden}
    :root[data-theme="dark"] .ig-wrap{background:#e8e8e8}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a href="./index.html" class="brand">
        <img src="img/logo_c5.png" alt="Corbiolo" class="brand-logo">
        <span class="title">Video</span>
      </a>
    </div>
    <div class="right">
      <button type="button" id="menuBtn" class="iconbtn" aria-label="Menu" title="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="drawer" class="drawer">
    <button type="button" id="drawer-close" class="drawer-close" aria-label="Chiudi">✕</button>
    <h3>Menu</h3>
    <a href="./index.html">🏠 Home</a>
    <a href="./news.html">📰 News</a>
    <a href="./squadra.html">👥 Squadra</a>
    <a href="./video.html">🎥 Video</a>
    <a href="./prossima.html">📅 Prossima partita</a>
    <a href="./partite.html">🏆 Risultati</a>
    <a href="./calendario.html">📆 Calendario</a>
    <a href="./competizioni.html">📋 Competizioni</a>
    <a href="./classifica.html">🏅 Classifica</a>
    <a href="./dove.html">📍 Dove si gioca</a>
    <a href="./settings.html">🔔 Impostazioni</a>
    <a href="./admin.html">⚙️ Admin</a>
    <hr style="border:none;border-top:1px solid var(--ring);margin:10px 0">
    <a href="./scarica.html">📲 Scarica l'app</a>
  </nav>

  <main class="container">
    <section class="card">
      <h2 style="margin:0 0 8px 0">Ultimi video</h2>
      <div id="videos" class="video-list"></div>
    </section>
  </main>

  <script>
    (function(){
      var drawer = document.getElementById('drawer');
      var menuBtn = document.getElementById('menuBtn');
      var closeBtn = document.getElementById('drawer-close');
      menuBtn.addEventListener('click', function(e){ e.stopPropagation(); drawer.classList.add('open'); });
      closeBtn.addEventListener('click', function(){ drawer.classList.remove('open'); });
      document.addEventListener('click', function(e){
        if (drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== menuBtn){
          drawer.classList.remove('open');
        }
      });
    })();
  </script>

  <script defer src="./onboarding.js?v=1"></script>
  <script src="./ui.js?v=35"></script>
  <script defer src="./install-prompt.js?v=2"></script>

  <script type="module">
    import { subscribeVideos } from './data-store.js';

    const box = document.getElementById('videos');

    const isYouTube = (u)=> /youtube\.com\/watch\?v=|youtu\.be\//i.test(u||'');
    const isInstagram = (u)=> /instagram\.com\/(p|reel|tv)\//i.test(u||'');
    const ytId = (u)=>{
      if (!u) return '';
      const m1 = u.match(/[?&]v=([^&]+)/); if (m1) return m1[1];
      const m2 = u.match(/youtu\.be\/([^?&]+)/); if (m2) return m2[1];
      return '';
    };

    // Lo script ufficiale Instagram trasforma i <blockquote> in veri post/reel
    // incorporati. Va caricato una volta sola, e richiamato di nuovo ogni volta
    // che aggiungiamo nuovi blockquote alla pagina (non li processa da solo).
    let igScriptLoaded = false;
    function ensureInstagramScript(){
      if (igScriptLoaded) { window.instgrm?.Embeds?.process(); return; }
      igScriptLoaded = true;
      const s = document.createElement('script');
      s.src = 'https://www.instagram.com/embed.js';
      s.async = true;
      document.body.appendChild(s);
    }

    function card(v){
      const titolo = v.nome || 'Video';
      const thumb = v.logo ? (v.logo.startsWith('http') ? v.logo : `img/${v.logo}`) : '';
      const link  = v.link || '';

      if (isInstagram(link)){
        return `
          <a class="card video-card" href="${link}" target="_blank" rel="noopener"
            style="display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;gap:10px">
            <div class="title" style="margin:0">🎥 ${titolo}</div>
            <span style="font-size:20px;flex-shrink:0">➜</span>
          </a>`;
      } else if (isYouTube(link)){
        const id = ytId(link);
        const src = `https://www.youtube.com/embed/${id}`;
        return `
          <article class="card video-card">
            <div class="ratio"><iframe src="${src}" allowfullscreen loading="lazy"></iframe></div>
            <div class="title">${titolo}</div>
            <a class="small" href="${link}" target="_blank" rel="noopener">▶️ Apri su YouTube</a>
          </article>`;
      } else {
        return `
          <article class="card video-card">
            <a href="${link}" target="_blank" rel="noopener">
              <div class="ratio">
                ${thumb ? `<img src="${thumb}" alt="" onerror="this.style.display='none'">` : ''}
              </div>
            </a>
            <div class="title">${titolo}</div>
            ${link ? `<a class="small" href="${link}" target="_blank" rel="noopener">▶️ Guarda il video</a>` : ''}
          </article>`;
      }
    }

    // 👇 si aggiorna da solo appena l'admin aggiunge/modifica un video
    subscribeVideos((list) => {
      box.innerHTML = (list||[]).length
        ? list.map(card).join('')
        : `<div class="small">Nessun video disponibile.</div>`;
    });

    localStorage.setItem('corb-seen-video', String(Date.now()));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
