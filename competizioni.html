<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <script>(function(){var a=localStorage.getItem("corb-theme-auto");if(a===null)a="on";var t;if(a==="on"){var h=new Date().getHours();t=(h>=19||h<7)?"dark":"light";}else{t=localStorage.getItem("corb-theme")||"light";}document.documentElement.dataset.theme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Competizioni - CORBIOLOC5</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/logo_c5.png">
  <link rel="stylesheet" href="./style.css?v=35">
  <style>
    .season-select{display:flex;align-items:center;gap:8px;margin:12px 0}
    .season-select select{border:1px solid var(--ring);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--text);font:inherit;font-weight:700}
    .tipo-tabs{display:flex;gap:8px;margin:10px 0}
    .tipo-tab{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--ring);background:var(--card);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;text-align:center}
    .tipo-tab.active{background:var(--granata);color:#fff;border-color:transparent}
    .giornata-picker{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0}
    .giornata-picker button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ring);background:var(--card);color:var(--text);font-size:18px;font-weight:800;cursor:pointer}
    .giornata-picker .num{font-size:18px;font-weight:900;min-width:90px;text-align:center}
    .g-match{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;font-size:13px;margin-bottom:6px;background:var(--card);border:1px solid var(--ring)}
    .g-match.me{background:#f5e7ea;border-color:#e4cbd3}
    :root[data-theme="dark"] .g-match.me{background:#3a2530}
    .g-team-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .g-team-line .g-left{display:flex;align-items:center;gap:8px;overflow:hidden;flex:1;min-width:0}
    .g-team-line .g-left span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
    .g-team-line img,.g-team-line .logo{flex-shrink:0}
    .g-score-single{font-weight:900;font-size:15px;flex-shrink:0}
    .fase-block{margin-bottom:16px}
    .fase-title{font-weight:900;font-size:14px;margin-bottom:6px;color:var(--granata);text-transform:uppercase;letter-spacing:.5px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a href="./index.html" class="brand">
        <img src="img/logo_c5.png" class="brand-logo" alt="">
        <span class="title">Competizioni</span>
      </a>
    </div>
    <div class="right">
      <button id="menuBtn" class="iconbtn" aria-label="Menu" title="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <nav id="drawer" class="drawer">
    <button id="drawer-close" class="drawer-close" aria-label="Chiudi">✕</button>
    <h3>Menu</h3>
    <a href="./index.html">🏠 Home</a>
    <a href="./news.html">📰 News</a>
    <a href="./squadra.html">👥 Squadra</a>
    <a href="./video.html">🎥 Video</a>
    <a href="./prossima.html">📅 Prossima partita</a>
    <a href="./partite.html">🏆 Risultati</a>
    <a href="./calendario.html">📆 Calendario</a>
    <a href="./competizioni.html">📋 Competizioni</a>
    <a href="./classifica.html">🏅 Classifica</a>
    <a href="./dove.html">📍 Dove si gioca</a>
    <a href="./settings.html">🔔 Impostazioni</a>
    <a href="./admin.html">⚙️ Admin</a>
    <hr style="border:none;border-top:1px solid var(--ring);margin:10px 0">
    <a href="./scarica.html">📲 Scarica l'app</a>
  </nav>

  <main class="container">
    <section class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap">
        <h2 style="margin:0">Competizioni</h2>
        <div class="season-select">
          <label for="seasonPick" class="small">Stagione</label>
          <select id="seasonPick"></select>
        </div>
      </div>

      <div class="tipo-tabs">
        <button class="tipo-tab active" data-tipo="Campionato">🏆 Campionato</button>
        <button class="tipo-tab" data-tipo="Coppa">🏅 Coppa</button>
        <button class="tipo-tab" data-tipo="Amichevole">🤝 Amichevole</button>
      </div>

      <div id="content"></div>
      <div id="empty" class="small" style="margin-top:10px"></div>
    </section>
  </main>

  <script type="module">
    import { subscribeMatches, currentSeason } from './data-store.js';

    const drawer = document.getElementById('drawer');
    document.getElementById('menuBtn').onclick = (e)=>{e.stopPropagation();drawer.classList.add('open')};
    document.getElementById('drawer-close').onclick = ()=> drawer.classList.remove('open');
    document.addEventListener('click', (e)=>{ if(drawer.classList.contains('open') && !drawer.contains(e.target)) drawer.classList.remove('open') });

    const CORB = 'corbiolo';
    const badge = (name, url, size) => (typeof window.teamBadgeHTML === 'function')
      ? window.teamBadgeHTML(name, url, size)
      : `<div style="width:${size}px;height:${size}px;border-radius:22%;background:#ccc;flex-shrink:0"></div>`;
    const seasonPick = document.getElementById('seasonPick');
    const content = document.getElementById('content');
    const empty = document.getElementById('empty');

    let all = [];
    let selectedSeason = currentSeason();
    let selectedTipo = 'Campionato';
    let selectedGiornata = null; // null = da calcolare in automatico (la più vicina ad oggi)

    function populateSeasons(){
      const seasons = [...new Set(all.map(r => r.stagione || currentSeason()))].sort((a,b)=> b.localeCompare(a));
      if (!seasons.includes(selectedSeason)) seasons.unshift(selectedSeason);
      seasonPick.innerHTML = seasons.map(s => `<option value="${s}" ${s===selectedSeason?'selected':''}>${s}</option>`).join('');
    }
    seasonPick.addEventListener('change', ()=>{ selectedSeason = seasonPick.value; selectedGiornata = null; render(); });

    document.querySelectorAll('.tipo-tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.tipo-tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        selectedTipo = btn.dataset.tipo;
        render();
      });
    });

    function matchRowHtml(m){
      const isMe = (m.casa||'').trim().toLowerCase()===CORB || (m.fuori||'').trim().toLowerCase()===CORB;
      const casa = m.casa || '?';
      const fuori = m.fuori || '?';
      const scoreMatch = (m.risultato||'').trim().match(/(\d+)\s*[-–]\s*(\d+)/);
      const scoreCasa = scoreMatch ? scoreMatch[1] : '';
      const scoreFuori = scoreMatch ? scoreMatch[2] : '';
      const casaBadge = casa.toLowerCase()===CORB
        ? `<img src="img/logo_c5.png" style="width:22px;height:22px;border-radius:5px;object-fit:contain" alt="">`
        : badge(casa, m.logo_casa, 22);
      const fuoriBadge = fuori.toLowerCase()===CORB
        ? `<img src="img/logo_c5.png" style="width:22px;height:22px;border-radius:5px;object-fit:contain" alt="">`
        : badge(fuori, m.logo_fuori, 22);
      return `
        <div class="g-match ${isMe?'me':''}">
          <div class="g-team-line">
            <div class="g-left">${casaBadge}<span>${casa}</span></div>
            <div class="g-score-single">${scoreCasa}</div>
          </div>
          <div class="g-team-line">
            <div class="g-left">${fuoriBadge}<span>${fuori}</span></div>
            <div class="g-score-single">${scoreFuori}</div>
          </div>
          ${!scoreMatch ? `<div class="small">${m.data||''}</div>` : ''}
        </div>`;
    }

    function render(){
      const bySeason = all.filter(m => (m.stagione||currentSeason())===selectedSeason);
      const rows = bySeason.filter(m => (m.tipo||'Campionato') === selectedTipo);

      if (!rows.length){
        content.innerHTML = '';
        empty.textContent = `Nessuna partita di tipo "${selectedTipo}" caricata per questa stagione.`;
        return;
      }
      empty.textContent = '';

      if (selectedTipo === 'Campionato'){
        const giornateDisponibili = [...new Set(rows.map(m=>+m.giornata||0))].filter(g=>g>0).sort((a,b)=>a-b);
        if (!giornateDisponibili.length){ content.innerHTML = '<div class="small">Nessuna giornata numerata ancora.</div>'; return; }

        if (selectedGiornata === null || !giornateDisponibili.includes(selectedGiornata)){
          // Calcolo la giornata "più vicina ad oggi": per ognuna prendo la data
          // media delle sue partite e scelgo quella con la distanza minore da oggi.
          const oggi = new Date();
          let miglior = giornateDisponibili[0];
          let distanzaMinima = Infinity;
          giornateDisponibili.forEach(g=>{
            const dateG = rows.filter(m=>(+m.giornata||0)===g).map(m=> new Date(m.data)).filter(d=>!isNaN(+d));
            if (!dateG.length) return;
            const media = dateG.reduce((a,d)=>a+d.getTime(),0) / dateG.length;
            const distanza = Math.abs(oggi.getTime() - media);
            if (distanza < distanzaMinima){ distanzaMinima = distanza; miglior = g; }
          });
          selectedGiornata = miglior;
        }

        const matches = rows.filter(m => (+m.giornata||0) === selectedGiornata).sort((a,b)=>(a.data||'').localeCompare(b.data||''));

        content.innerHTML = `
          <div class="giornata-picker">
            <button id="gPrev">←</button>
            <div class="num">Giornata ${selectedGiornata}</div>
            <button id="gNext">→</button>
          </div>
          ${matches.map(matchRowHtml).join('')}
        `;
        const idx = giornateDisponibili.indexOf(selectedGiornata);
        document.getElementById('gPrev').onclick = ()=>{ if (idx>0){ selectedGiornata = giornateDisponibili[idx-1]; render(); } };
        document.getElementById('gNext').onclick = ()=>{ if (idx<giornateDisponibili.length-1){ selectedGiornata = giornateDisponibili[idx+1]; render(); } };

      } else if (selectedTipo === 'Coppa'){
        const ordineFasi = ['Ottavi','Quarti','Semifinale','Finale'];
        const byFase = {};
        rows.forEach(m=>{ const f = m.fase || 'Altro'; (byFase[f]=byFase[f]||[]).push(m); });
        const fasiPresenti = ordineFasi.filter(f=>byFase[f]).concat(Object.keys(byFase).filter(f=>!ordineFasi.includes(f)));

        content.innerHTML = fasiPresenti.map(f=>`
          <div class="fase-block">
            <div class="fase-title">${f}</div>
            ${byFase[f].map(matchRowHtml).join('')}
          </div>
        `).join('');

      } else {
        // Amichevole: lista semplice
        const matches = rows.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
        content.innerHTML = matches.map(matchRowHtml).join('');
      }
    }

    subscribeMatches((rows) => {
      all = rows || [];
      populateSeasons();
      render();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
  <script defer src="./onboarding.js?v=1"></script>
  <script src="./ui.js?v=35"></script>
  <script defer src="./install-prompt.js?v=2"></script>
</body>
</html>
