<!doctype html>
<html lang="it">
<head>
  
  <meta charset="utf-8"/>
  <script>(function(){var a=localStorage.getItem("corb-theme-auto");if(a===null)a="on";var t;if(a==="on"){var h=new Date().getHours();t=(h>=19||h<7)?"dark":"light";}else{t=localStorage.getItem("corb-theme")||"light";}document.documentElement.dataset.theme=t;})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Prossima partita - CORBIOLOC5</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b0f1a">
  <link rel="apple-touch-icon" href="img/logo_c5.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./style.css?v=35">
  <style>
    .next-card{background:linear-gradient(180deg,#7d2631,#6b0f1a);color:#fff;border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(0,0,0,.14)}
    .next-card.derby{border:2px solid #facc15;box-shadow:0 0 0 3px rgba(250,204,21,.25),0 10px 26px rgba(0,0,0,.14)}
    .versus{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:8px}
    .teamBox{display:flex;flex-direction:column;align-items:center;text-align:center}
    .teamLogo{width:72px;height:72px;border-radius:14px;object-fit:contain;background:#ffffff18}
    .vsBadge{padding:16px 18px;border-radius:16px;background:#ffffff20;font-weight:900}
    .metaRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .pill-soft{background:#ffffff22;border:1px solid #ffffff44;color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:12px}
    .future-row{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ring)}
    .future-row:last-child{border-bottom:0}
    .tinyLogo{width:34px;height:34px;border-radius:10px;object-fit:contain}
    .teamName{font-weight:700}
    .when{grid-column:1/-1;color:var(--muted);font-size:13px;margin-top:6px}
    .goCal{background:#ffffff25;border:1px solid #ffffff55;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a href="./index.html" class="brand">
        <img src="img/logo_c5.png" alt="" class="brand-logo">
        <span class="title">Prossima partita</span>
      </a>
    </div>
    <div class="right">
      <button id="menuBtn" class="iconbtn" aria-label="Menu" title="Menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="drawer" class="drawer">
    <button id="drawer-close" class="drawer-close" aria-label="Chiudi">✕</button>
    <h3>Menu</h3>
    <a href="./index.html">🏠 Home</a>
    <a href="./news.html">📰 News</a>
    <a href="./squadra.html">👥 Squadra</a>
    <a href="./video.html">🎥 Video</a>
    <a href="./prossima.html">📅 Prossima partita</a>
    <a href="./partite.html">🏆 Risultati</a>
    <a href="./calendario.html">📆 Calendario</a>
    <a href="./competizioni.html">📋 Competizioni</a>
    <a href="./classifica.html">🏅 Classifica</a>
    <a href="./dove.html">📍 Dove si gioca</a>
    <a href="./settings.html">🔔 Impostazioni</a>
    <a href="./admin.html">⚙️ Admin</a>
    <hr style="border:none;border-top:1px solid var(--ring);margin:10px 0">
    <a href="./scarica.html">📲 Scarica l'app</a>
  </nav>

  <main class="container">
    <section class="next-card" id="nextCard">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">La prossima</h2>
        <a class="goCal" href="./calendario.html">Vedi calendario</a>
      </div>
      <div id="nextBlock" class="versus" style="margin-top:10px"></div>
      <div id="nextMeta" class="metaRow"></div>
      <button id="addCalBtn" class="pill-soft" style="display:none;border:1px solid #ffffff44;cursor:pointer;margin-top:8px;align-items:center;gap:6px">📅 Aggiungi al calendario</button>
    </section>

    <section class="card" style="margin-top:14px">
      <h2 style="margin:0 0 8px 0">Partite future</h2>
      <div id="futureList"></div>
    </section>
  </main>

  <script type="module">
    import { subscribeMatches } from './data-store.js';

    const drawer = document.getElementById('drawer');
    document.getElementById('menuBtn').onclick = (e)=>{e.stopPropagation();drawer.classList.add('open')};
    document.getElementById('drawer-close').onclick = ()=> drawer.classList.remove('open');
    document.addEventListener('click', (e)=>{ if(drawer.classList.contains('open') && !drawer.contains(e.target)) drawer.classList.remove('open') });

    const CORB = 'corbiolo';
    const badge = (name, url, size) => (typeof window.teamBadgeHTML === 'function')
      ? window.teamBadgeHTML(name, url, size)
      : `<div style="width:${size}px;height:${size}px;border-radius:22%;background:#ccc;flex-shrink:0"></div>`;
    const LOGO_CORB = 'img/logo_c5.png';

    const toDate = (m)=>{
      const dt = new Date((m.data||'')+'T'+(m.ora||'00:00'));
      return isNaN(+dt) ? new Date(m.data||'') : dt;
    };
    const fmtLong = (d)=> d.toLocaleDateString(undefined,{weekday:'short', day:'2-digit', month:'long'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});

    const nextBlock = document.getElementById('nextBlock');
    const nextMeta  = document.getElementById('nextMeta');
    const fWrap = document.getElementById('futureList');

    function pad2(n){ return String(n).padStart(2,'0'); }
    function icsDate(d){
      return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
    }
    function addToCalendar(match, homeName, awayName){
      const start = match.date;
      const end = new Date(start.getTime() + 90*60000); // partita ~90 minuti
      const titolo = `${homeName} vs ${awayName}`;
      const luogo = homeName.toLowerCase()===CORB ? 'C.S. Monti Lessini, Contrada Carcaro, Bosco Chiesanuova (VR)' : '';
      const isAndroid = /android/i.test(navigator.userAgent);

      if (isAndroid){
        // Google Calendar già compilato: un tocco su "Salva" e basta, niente file
        const gUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE`
          + `&text=${encodeURIComponent(titolo)}`
          + `&dates=${icsDate(start)}Z/${icsDate(end)}Z`
          + `&details=${encodeURIComponent('Partita U.S. Corbiolo C5')}`
          + (luogo ? `&location=${encodeURIComponent(luogo)}` : '');
        window.open(gUrl, '_blank');
        return;
      }

      // iPhone e altri: apriamo il file calendario direttamente (non lo scarichiamo
      // come file separato) — Safari lo riconosce da solo e mostra "Aggiungi evento".
      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//CorbioloC5//App//IT',
        'BEGIN:VEVENT',
        `UID:${match.id||Date.now()}@corbioloc5`,
        `DTSTAMP:${icsDate(new Date())}`,
        `DTSTART:${icsDate(start)}`,
        `DTEND:${icsDate(end)}`,
        `SUMMARY:${titolo}`,
        luogo ? `LOCATION:${luogo}` : '',
        'DESCRIPTION:Partita U.S. Corbiolo C5',
        'END:VEVENT',
        'END:VCALENDAR'
      ].filter(Boolean).join('\r\n');

      window.location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    }

    // 👇 si aggiorna da solo appena viene inserita/modificata una partita
    subscribeMatches((allRowsRaw) => {
      const rows = (allRowsRaw||[]).filter(m => (m.casa||'').trim().toLowerCase()==='corbiolo' || (m.fuori||'').trim().toLowerCase()==='corbiolo');
      const matches = (rows||[]).map(m=>({...m, date:toDate(m)})).filter(m=>!isNaN(+m.date));
      const now = new Date();
      const future = matches.filter(m=> m.date > now).sort((a,b)=> a.date - b.date);

      const next = future[0];
      if(next){
        const homeName = (next.casa||'Corbiolo').trim();
        const awayName = (next.fuori||'Avversario').trim();
        const homeBadge = homeName.toLowerCase()===CORB ? `<img class="teamLogo" src="${LOGO_CORB}" alt="">` : badge(homeName, next.logo_casa, 64);
        const awayBadge = awayName.toLowerCase()===CORB ? `<img class="teamLogo" src="${LOGO_CORB}" alt="">` : badge(awayName, next.logo_fuori, 64);

        nextBlock.innerHTML = `
          <div class="teamBox">
            ${homeBadge}
            <div style="font-weight:800;margin-top:8px">${homeName}</div>
          </div>
          <div class="vsBadge">VS</div>
          <div class="teamBox">
            ${awayBadge}
            <div style="font-weight:800;margin-top:8px">${awayName}</div>
          </div>`;

        const isHomeCorb = homeName.toLowerCase()===CORB;
        nextMeta.innerHTML = `
          <span class="pill-soft">${isHomeCorb?'🏠 Casa':'✈️ Trasferta'}</span>
          <span class="pill-soft">${fmtLong(next.date)}</span>
          ${next.tipo && next.tipo!=='Campionato' ? `<span class="pill-soft">${next.tipo}</span>` : ''}
          ${next.speciale==='Sì' ? `<span class="pill-soft" style="background:#facc15;color:#3a2f00;font-weight:800">🔥 DA NON PERDERE</span>` : ''}
        `;

        document.getElementById('nextCard').classList.toggle('derby', next.speciale==='Sì');
        document.getElementById('addCalBtn').style.display = 'inline-flex';
        document.getElementById('addCalBtn').onclick = () => addToCalendar(next, homeName, awayName);
      } else {
        nextBlock.innerHTML = `<div class="small" style="grid-column:1/-1">Nessuna partita in programma</div>`;
        nextMeta.innerHTML = '';
        document.getElementById('addCalBtn').style.display = 'none';
      }

      fWrap.innerHTML = future.length ? future.map(m=>{
        const homeName = (m.casa||'Corbiolo').trim();
        const awayName = (m.fuori||'Avversario').trim();
        const homeBadge = homeName.toLowerCase()===CORB ? `<img class="tinyLogo" src="${LOGO_CORB}" alt="">` : badge(homeName, m.logo_casa, 28);
        const awayBadge = awayName.toLowerCase()===CORB ? `<img class="tinyLogo" src="${LOGO_CORB}" alt="">` : badge(awayName, m.logo_fuori, 28);

        return `
          <div class="future-row">
            ${homeBadge}
            <div class="teamName">${homeName}</div>
            ${awayBadge}
            <div class="teamName">${awayName}</div>
            <div class="when">${fmtLong(m.date)}${m.tipo && m.tipo!=='Campionato' ? ' · '+m.tipo : ''}</div>
          </div>`;
      }).join('') : '<div class="small">Nessuna partita futura</div>';
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
  <script defer src="./onboarding.js?v=1"></script>
  <script src="./ui.js?v=35"></script>
  <script defer src="./install-prompt.js?v=2"></script>
</body>
</html>
